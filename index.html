<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2b22">
<meta name="apple-mobile-web-app-title" content="Secret Santa">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Family Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--spruce:#0d2b22;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--snow:#f4f7f5;--mute:#b3c9bd;--berry:#c8142f;--gold:#f3c969;--bad:#ff9fae}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;color:var(--snow);font:16px/1.55 Inter,system-ui,sans-serif;background-color:var(--spruce);
background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,255,255,.55),transparent),radial-gradient(1.5px 1.5px at 95px 85px,rgba(255,255,255,.4),transparent),radial-gradient(2px 2px at 150px 140px,rgba(255,255,255,.5),transparent),radial-gradient(900px 500px at 50% -8%,#1e6048,transparent 65%);
background-size:180px 180px,180px 180px,180px 180px,auto;background-repeat:repeat,repeat,repeat,no-repeat}
main{max-width:520px;margin:0 auto;padding:0 18px 56px;padding-top:env(safe-area-inset-top,0px)}
.garland{display:block;width:calc(100% + 36px);margin:0 -18px;height:44px}
header{text-align:center;padding:10px 0 22px}
h1{font:800 clamp(2.2rem,9vw,3rem)/1.05 Fraunces,Georgia,serif;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0 auto;max-width:34ch;color:var(--mute)}
nav{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;margin-bottom:16px}
nav button{flex:1;margin:0;padding:10px 6px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:600 .95rem Inter,sans-serif;cursor:pointer}
nav button.on{background:var(--berry);color:#fff}
section{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 22px 24px;backdrop-filter:blur(6px)}
label{display:block;font-weight:600;margin:18px 0 6px}
small{display:block;color:var(--mute);margin-top:6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);color:var(--snow);font:inherit}
select option{background:#14382c;color:#fff}
textarea{min-height:110px;resize:vertical}
::placeholder{color:#7f9c8e}
button.cta{margin-top:20px;width:100%;padding:14px 18px;border:0;border-radius:12px;background:var(--berry);color:#fff;font:600 1rem Inter,sans-serif;cursor:pointer}
button.cta.alt{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{font-weight:600;margin-top:14px;min-height:1.5em;color:var(--gold)}
.msg.bad{color:var(--bad)}
.hidden{display:none}
.gift{position:relative;overflow:hidden;margin-top:22px;padding:34px 22px;border-radius:18px;text-align:center;color:#0d2b22;background:linear-gradient(165deg,#ffffff,#e4ede8)}
.gift .for{font-weight:600;color:#3b5a4b}
.gift .name{font:800 2.5rem/1.1 Fraunces,Georgia,serif;color:var(--berry);margin:6px 0 18px;overflow-wrap:anywhere}
.gift .wish{white-space:pre-wrap;text-align:left;background:#fbf3dc;border-radius:12px;padding:14px;color:#3a2f10}
.gift::before,.gift::after{content:"";position:absolute;background:var(--berry);z-index:2}
.gift::before{left:0;right:0;top:50%;height:38px;margin-top:-19px;animation:slideH 1s .3s ease-in forwards}
.gift::after{top:0;bottom:0;left:50%;width:38px;margin-left:-19px;animation:slideV 1s .3s ease-in forwards}
.gift>*{animation:pop .6s .95s both}
@keyframes slideH{to{transform:translateX(105%)}}
@keyframes slideV{to{transform:translateY(-105%)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.gift::before,.gift::after{display:none}.gift>*{animation:none}}
</style>
</head>
<body>
<main>
<svg class="garland" viewBox="0 0 560 44" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <path d="M0 6Q47 34 93 6Q140 34 187 6Q233 34 280 6Q327 34 373 6Q420 34 467 6Q513 34 560 6" fill="none" stroke="#3f7a62" stroke-width="2"/>
  <g stroke="#3f7a62" stroke-width="2"><path d="M47 20v5M140 20v5M233 20v5M327 20v5M420 20v5M513 20v5"/></g>
  <circle cx="47" cy="31" r="6" fill="#c8142f"/><circle cx="140" cy="31" r="6" fill="#f3c969"/><circle cx="233" cy="31" r="6" fill="#f4f7f5"/>
  <circle cx="327" cy="31" r="6" fill="#c8142f"/><circle cx="420" cy="31" r="6" fill="#f3c969"/><circle cx="513" cy="31" r="6" fill="#f4f7f5"/>
</svg>
<header>
  <h1>Family Secret Santa</h1>
  <p>Add your name and wish list. After the draw, see who you're shopping for.</p>
</header>
<nav>
  <button class="on" data-tab="join">Join</button>
  <button data-tab="match">My match</button>
  <button data-tab="org">Organizer</button>
</nav>

<section id="join">
  <label for="jn">Your name</label><input id="jn" autocomplete="off">
  <label for="jp">4-digit PIN</label><input id="jp" inputmode="numeric" maxlength="4" autocomplete="off">
  <small>You'll need this PIN to see your match or edit your wish list.</small>
  <button class="cta alt" id="loadBtn" type="button">Load my saved details</button>
  <label for="jw">Gift ideas and wish list</label><textarea id="jw" placeholder="Sizes, favourite things, anything you'd love"></textarea>
  <button class="cta" id="joinBtn">Save my details</button>
  <div class="msg" id="jm"></div>
</section>

<section id="match" class="hidden">
  <label for="ms">Who are you?</label><select id="ms"></select>
  <label for="mp">Your PIN</label><input id="mp" inputmode="numeric" maxlength="4" autocomplete="off">
  <button class="cta" id="seeBtn">Show who I drew</button>
  <div class="msg" id="mm"></div>
  <div id="gift" class="gift hidden">
    <div class="for">You're buying a gift for</div>
    <div class="name" id="gt"></div>
    <div class="wish" id="gw"></div>
  </div>
</section>

<section id="org" class="hidden">
  <label for="oc">Organizer code</label><input id="oc" type="password" autocomplete="off">
  <button class="cta" id="unlockBtn">Unlock</button>
  <div class="msg" id="om"></div>
  <div id="orgTools" class="hidden">
    <p id="count"></p>
    <label for="rules">Who shouldn't draw each other? (optional)</label>
    <textarea id="rules" placeholder="Anna, Ben&#10;Carla, David"></textarea>
    <small>One pair per line, separated by a comma. The rule works both ways.</small>
    <button class="cta" id="drawBtn">Run the draw</button>
    <button class="cta alt" id="resetBtn">Reset the draw</button>
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== PASTE YOUR OWN VALUES OVER THESE TWO BLOCKS ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUyAC2SkqweOOKqctQDT-FO44J6wgDyig",
  authDomain: "family-secret-santa-816af.firebaseapp.com",
  projectId: "family-secret-santa-816af",
  storageBucket: "family-secret-santa-816af.firebasestorage.app",
  messagingSenderId: "819977069071",
  appId: "1:819977069071:web:52905b31b2bac8082db97a"
};
const ORGANIZER_CODE = "MSHK98";
/* ======================================================= */

const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const drawRef = doc(db, "meta", "draw");
const $ = id => document.getElementById(id);
const slug = n => n.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-");
const say = (id, text, bad) => { $(id).textContent = text; $(id).className = "msg" + (bad ? " bad" : ""); };
const people = async () => (await getDocs(collection(db, "people"))).docs.map(d => ({id: d.id, ...d.data()}));

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.className = "");
  b.className = "on";
  ["join", "match", "org"].forEach(s => $(s).classList.toggle("hidden", s !== b.dataset.tab));
  if (b.dataset.tab === "match") loadNames();
});

async function loadNames() {
  try {
    const list = (await people()).sort((a, b) => a.name.localeCompare(b.name));
    $("ms").innerHTML = "";
    list.forEach(p => $("ms").add(new Option(p.name, p.id)));
  } catch (e) { say("mm", "Couldn't load names. Check your connection.", true); }
}

$("joinBtn").onclick = async () => {
  const name = $("jn").value.trim(), pin = $("jp").value.trim(), wish = $("jw").value.trim();
  if (!name || !/^\d{4}$/.test(pin)) return say("jm", "Enter your name and a 4-digit PIN.", true);
  try {
    const ref = doc(db, "people", slug(name));
    const snap = await getDoc(ref);
    if (snap.exists()) {
      if (snap.data().pin !== pin) return say("jm", "That name is taken and the PIN doesn't match.", true);
    } else if ((await getDoc(drawRef)).exists()) {
      return say("jm", "The draw has already happened, so new names can't join.", true);
    }
    await setDoc(ref, {name, pin, wish});
    say("jm", "Saved. You can come back to edit your wish list with the same name and PIN.");
  } catch (e) { say("jm", "Couldn't save. Check your connection and the Firebase setup.", true); }
};

$("loadBtn").onclick = async () => {
  const name = $("jn").value.trim(), pin = $("jp").value.trim();
  if (!name || !/^\d{4}$/.test(pin)) return say("jm", "Enter your name and PIN first.", true);
  try {
    const snap = await getDoc(doc(db, "people", slug(name)));
    if (!snap.exists()) return say("jm", "No one has joined with that name yet.", true);
    const d = snap.data();
    if (d.pin !== pin) return say("jm", "Wrong PIN.", true);
    $("jn").value = d.name;
    $("jw").value = d.wish || "";
    say("jm", "Loaded. Edit your wish list and press Save.");
  } catch (e) { say("jm", "Couldn't load. Check your connection.", true); }
};

$("seeBtn").onclick = async () => {
  $("gift").classList.add("hidden");
  const id = $("ms").value, pin = $("mp").value.trim();
  if (!id) return say("mm", "No names yet. Ask everyone to join first.", true);
  try {
    const me = (await getDoc(doc(db, "people", id))).data();
    if (!me || me.pin !== pin) return say("mm", "Wrong PIN.", true);
    const d = await getDoc(drawRef);
    if (!d.exists()) return say("mm", "The draw hasn't happened yet. Check back soon.", true);
    const t = (await getDoc(doc(db, "people", d.data().pairs[id]))).data();
    say("mm", "");
    $("gt").textContent = t.name;
    $("gw").textContent = t.wish || "They haven't added a wish list yet.";
    $("gift").classList.remove("hidden");
  } catch (e) { say("mm", "Something went wrong. Try again.", true); }
};

$("unlockBtn").onclick = async () => {
  if ($("oc").value !== ORGANIZER_CODE) return say("om", "Wrong code.", true);
  say("om", "");
  $("orgTools").classList.remove("hidden");
  const n = (await people()).length;
  $("count").textContent = n + " " + (n === 1 ? "person has" : "people have") + " joined.";
};

const pair = (a, b) => [a, b].sort().join("|");
$("drawBtn").onclick = async () => {
  const ppl = await people();
  if (ppl.length < 3) return say("om", "You need at least 3 people.", true);
  if ((await getDoc(drawRef)).exists()) return say("om", "Already drawn. Reset first to redo it.", true);
  const banned = new Set($("rules").value.split("\n").map(l => l.split(",").map(s => slug(s)))
    .filter(p => p.length === 2 && p[0] && p[1]).map(p => pair(p[0], p[1])));
  const ids = ppl.map(p => p.id);
  for (let t = 0; t < 2000; t++) {
    const to = [...ids];
    for (let i = to.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [to[i], to[j]] = [to[j], to[i]]; }
    if (ids.every((id, i) => id !== to[i] && !banned.has(pair(id, to[i])))) {
      const pairs = {}; ids.forEach((id, i) => pairs[id] = to[i]);
      await setDoc(drawRef, {pairs});
      return say("om", "Draw done. Everyone can now see their match.");
    }
  }
  say("om", "No valid draw with those rules. Remove a rule and try again.", true);
};

$("resetBtn").onclick = async () => {
  if (!confirm("Reset the draw? Everyone's current match will be removed.")) return;
  await deleteDoc(drawRef);
  say("om", "Draw reset. New names can join again.");
};
</script>
</body>
</html>
