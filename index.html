<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-title" content="Secret Santa">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Family Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--ink:#1d2b24;--pine:#1f4d3a;--berry:#a3213a;--card:#fff;--line:#d9d3c7}
@media(prefers-color-scheme:dark){:root{--bg:#14201a;--ink:#f1ede4;--pine:#6fbf95;--berry:#e8788d;--card:#1d2d25;--line:#33473c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 20px 64px}
h1{font:800 2.4rem/1.1 Fraunces,Georgia,serif;color:var(--pine);margin:0 0 8px}
p{margin:0 0 16px}
label{display:block;font-weight:600;margin:18px 0 6px}
small{display:block;opacity:.7;margin-top:4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:110px}
button{font:600 1rem Inter,sans-serif;border:0;border-radius:8px;padding:12px 18px;background:var(--pine);color:#fff;cursor:pointer;margin-top:16px}
button.alt{background:transparent;color:var(--pine);border:1px solid var(--pine)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
nav{display:flex;gap:8px;margin:20px 0 4px}
nav button{margin:0;flex:1;padding:10px 6px}
nav button.on{background:var(--pine);color:#fff}
.msg{font-weight:600;margin-top:12px;min-height:1.5em}
.msg.bad{color:var(--berry)}
.gift{background:var(--pine);color:#fff;border-radius:14px;padding:32px 24px;margin-top:24px;text-align:center}
.gift .name{font:800 2.4rem Fraunces,Georgia,serif;margin:8px 0 16px}
.gift .wish{white-space:pre-wrap;text-align:left;background:rgba(255,255,255,.12);border-radius:8px;padding:12px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Family Secret Santa</h1>
<p>Add your name and wish list, then come back after the draw to see who you got.</p>
<nav>
  <button class="on" data-tab="join">Join</button>
  <button class="alt" data-tab="match">My match</button>
  <button class="alt" data-tab="org">Organizer</button>
</nav>

<section id="join">
  <label for="jn">Your name</label><input id="jn" autocomplete="off">
  <label for="jp">4-digit PIN</label><input id="jp" inputmode="numeric" maxlength="4" autocomplete="off">
  <small>You'll need this PIN to see your match or edit your wish list.</small>
  <label for="jw">Gift ideas and wish list</label><textarea id="jw" placeholder="Sizes, favourite things, anything you'd love"></textarea>
  <button id="joinBtn">Save my details</button>
  <div class="msg" id="jm"></div>
</section>

<section id="match" class="hidden">
  <label for="ms">Who are you?</label><select id="ms"></select>
  <label for="mp">Your PIN</label><input id="mp" inputmode="numeric" maxlength="4" autocomplete="off">
  <button id="seeBtn">Show who I drew</button>
  <div class="msg" id="mm"></div>
  <div id="gift" class="gift hidden">
    <div>You're buying a gift for</div>
    <div class="name" id="gt"></div>
    <div class="wish" id="gw"></div>
  </div>
</section>

<section id="org" class="hidden">
  <label for="oc">Organizer code</label><input id="oc" type="password" autocomplete="off">
  <button id="unlockBtn">Unlock</button>
  <div class="msg" id="om"></div>
  <div id="orgTools" class="hidden">
    <p id="count"></p>
    <label for="rules">Who shouldn't draw each other? (optional)</label>
    <textarea id="rules" placeholder="Anna, Ben&#10;Carla, David"></textarea>
    <small>One pair per line, separated by a comma. The rule works both ways.</small>
    <button id="drawBtn">Run the draw</button>
    <button id="resetBtn" class="alt">Reset the draw</button>
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== EDIT THESE TWO THINGS ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUyAC2SkqweOOKqctQDT-FO44J6wgDyig",
  authDomain: "family-secret-santa-816af.firebaseapp.com",
  projectId: "family-secret-santa-816af",
  storageBucket: "family-secret-santa-816af.firebasestorage.app",
  messagingSenderId: "819977069071",
  appId: "1:819977069071:web:52905b31b2bac8082db97a"
};
const ORGANIZER_CODE = "MSHK98";
/* ================================= */

const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const drawRef = doc(db, "meta", "draw");
const $ = id => document.getElementById(id);
const slug = n => n.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-");
const say = (id, text, bad) => { $(id).textContent = text; $(id).className = "msg" + (bad ? " bad" : ""); };
const people = async () => (await getDocs(collection(db, "people"))).docs.map(d => ({id: d.id, ...d.data()}));

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.className = "alt");
  b.className = "on";
  ["join", "match", "org"].forEach(s => $(s).classList.toggle("hidden", s !== b.dataset.tab));
  if (b.dataset.tab === "match") loadNames();
});

async function loadNames() {
  try {
    const list = (await people()).sort((a, b) => a.name.localeCompare(b.name));
    $("ms").innerHTML = "";
    list.forEach(p => $("ms").add(new Option(p.name, p.id)));
  } catch (e) { say("mm", "Couldn't load names. Check your connection.", true); }
}

$("joinBtn").onclick = async () => {
  const name = $("jn").value.trim(), pin = $("jp").value.trim(), wish = $("jw").value.trim();
  if (!name || !/^\d{4}$/.test(pin)) return say("jm", "Enter your name and a 4-digit PIN.", true);
  try {
    const ref = doc(db, "people", slug(name));
    const snap = await getDoc(ref);
    if (snap.exists()) {
      if (snap.data().pin !== pin) return say("jm", "That name is taken and the PIN doesn't match.", true);
    } else if ((await getDoc(drawRef)).exists()) {
      return say("jm", "The draw has already happened, so new names can't join.", true);
    }
    await setDoc(ref, {name, pin, wish});
    say("jm", "Saved. You can come back to edit your wish list with the same name and PIN.");
  } catch (e) { say("jm", "Couldn't save. Check your connection and the Firebase setup.", true); }
};

$("seeBtn").onclick = async () => {
  $("gift").classList.add("hidden");
  const id = $("ms").value, pin = $("mp").value.trim();
  if (!id) return say("mm", "No names yet. Ask everyone to join first.", true);
  try {
    const me = (await getDoc(doc(db, "people", id))).data();
    if (!me || me.pin !== pin) return say("mm", "Wrong PIN.", true);
    const d = await getDoc(drawRef);
    if (!d.exists()) return say("mm", "The draw hasn't happened yet. Check back soon.", true);
    const t = (await getDoc(doc(db, "people", d.data().pairs[id]))).data();
    say("mm", "");
    $("gt").textContent = t.name;
    $("gw").textContent = t.wish || "They haven't added a wish list yet.";
    $("gift").classList.remove("hidden");
  } catch (e) { say("mm", "Something went wrong. Try again.", true); }
};

$("unlockBtn").onclick = async () => {
  if ($("oc").value !== ORGANIZER_CODE) return say("om", "Wrong code.", true);
  say("om", "");
  $("orgTools").classList.remove("hidden");
  const n = (await people()).length;
  $("count").textContent = n + " " + (n === 1 ? "person has" : "people have") + " joined.";
};

const pair = (a, b) => [a, b].sort().join("|");
$("drawBtn").onclick = async () => {
  const ppl = await people();
  if (ppl.length < 3) return say("om", "You need at least 3 people.", true);
  if ((await getDoc(drawRef)).exists()) return say("om", "Already drawn. Reset first to redo it.", true);
  const banned = new Set($("rules").value.split("\n").map(l => l.split(",").map(s => slug(s)))
    .filter(p => p.length === 2 && p[0] && p[1]).map(p => pair(p[0], p[1])));
  const ids = ppl.map(p => p.id);
  for (let t = 0; t < 2000; t++) {
    const to = [...ids];
    for (let i = to.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [to[i], to[j]] = [to[j], to[i]]; }
    if (ids.every((id, i) => id !== to[i] && !banned.has(pair(id, to[i])))) {
      const pairs = {}; ids.forEach((id, i) => pairs[id] = to[i]);
      await setDoc(drawRef, {pairs});
      return say("om", "Draw done. Everyone can now see their match.");
    }
  }
  say("om", "No valid draw with those rules. Remove a rule and try again.", true);
};

$("resetBtn").onclick = async () => {
  if (!confirm("Reset the draw? Everyone's current match will be removed.")) return;
  await deleteDoc(drawRef);
  say("om", "Draw reset. New names can join again.");
};
</script>
</body>
</html>
